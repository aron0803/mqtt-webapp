<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>開門</title>

    <link rel="manifest" href="manifest-open.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="開門">
    <link rel="apple-touch-icon" href="icon-open.svg">
    <link rel="icon" href="icon-open.svg" type="image/svg+xml">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

    <style>
        :root {
            --bg: #0f172a;
            --ok: #10b981;
            --err: #ef4444;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overscroll-behavior: none;
        }
        #stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 2rem;
            text-align: center;
            width: 100%;
            max-width: 360px;
        }
        #icon {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            background: rgba(255,255,255,0.06);
            border: none;
            color: inherit;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s ease, transform 0.15s ease;
        }
        #icon:active { transform: scale(0.96); }
        #icon.idle { background: rgba(59,130,246,0.16); }
        #icon.idle:hover { background: rgba(59,130,246,0.24); }
        #icon.pending { animation: pulse 1.1s ease-in-out infinite; pointer-events: none; }
        #icon.ok { background: rgba(16,185,129,0.18); transform: scale(1.05); }
        #icon.err { background: rgba(239,68,68,0.18); }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        #status {
            font-size: 1.25rem;
            font-weight: 700;
        }
        #detail {
            font-size: 0.85rem;
            color: var(--text-dim);
            min-height: 1.2em;
        }
        #meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            opacity: 0.7;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        #meta span { white-space: nowrap; }
        #setup-link {
            display: none;
            color: var(--text-dim);
            font-size: 0.85rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="stage">
        <button id="icon" class="idle">🚪</button>
        <div id="status">點一下開門</div>
        <div id="detail"></div>
        <div id="meta">
            <span id="meta-time"></span>
            <span id="meta-ip"></span>
        </div>
        <a id="setup-link" href="index.html">尚未設定，點此開啟設定頁</a>
    </div>

    <script>
        // 一鍵開門頁：按鈕永遠在畫面上，點一下才連線並送出開門指令。
        //
        // 原本設計是「一開啟頁面就自動觸發」，但實測 PWA 加到主畫面後從背景
        // 切回前景並不會可靠地重新執行；不同手機/瀏覽器對 standalone PWA
        // 恢復時要不要重新觸發 visibilitychange、要不要凍結 JS 執行的行為
        // 不一致，賭這個生命週期事件太不可靠。改成「按鈕永遠可按」——
        // 不管是第一次開啟還是從背景切回來，行為都一樣可預期：按了才動作。
        //
        // 門機本身的失效安全設計（COM+NO 接線、看門狗、開機安全狀態）都在
        // 裝置韌體端，跟這個頁面用自動觸發還是按鈕觸發無關。

        const TENANT_ID = 'default';
        const CONFIRM_TIMEOUT_MS = 6000;

        const elIcon = document.getElementById('icon');
        const elStatus = document.getElementById('status');
        const elDetail = document.getElementById('detail');
        const elMetaTime = document.getElementById('meta-time');
        const elMetaIp = document.getElementById('meta-ip');
        const elSetupLink = document.getElementById('setup-link');

        let activeClient = null;
        let busy = false;
        let confirmed = false;
        let t0 = 0;

        function setState(mode, status, detail) {
            elIcon.className = mode;
            elIcon.textContent = mode === 'ok' ? '✅' : (mode === 'err' ? '⚠️' : '🚪');
            elStatus.textContent = status;
            elDetail.textContent = detail || '';
        }

        function decodeConfigPayload(text) {
            if (!text) return null;
            let token = text.trim();
            const urlMatch = token.match(/[#&]c=([A-Za-z0-9_-]+)/);
            if (urlMatch) token = urlMatch[1];
            if (token.startsWith('{')) {
                try {
                    const cfg = JSON.parse(token);
                    return (cfg.b && cfg.u) ? cfg : null;
                } catch (e) { return null; }
            }
            if (!/^[A-Za-z0-9_-]+$/.test(token)) return null;
            try {
                let base64 = token.replace(/-/g, '+').replace(/_/g, '/');
                base64 += '='.repeat((4 - base64.length % 4) % 4);
                const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                const cfg = JSON.parse(new TextDecoder().decode(bytes));
                return (cfg.b && cfg.u) ? cfg : null;
            } catch (e) { return null; }
        }

        // 支援跟主頁一樣的 QR 設定 hash，方便同一張 QR 兩邊都能用來設定
        if (location.hash.includes('c=')) {
            const cfg = decodeConfigPayload(location.hash);
            history.replaceState(null, '', location.pathname + location.search);
            if (cfg) {
                localStorage.setItem('mqtt_broker', cfg.b);
                localStorage.setItem('mqtt_user', cfg.u);
                localStorage.setItem('mqtt_pass', cfg.p || '');
            }
        }

        const broker = localStorage.getItem('mqtt_broker');
        const user = localStorage.getItem('mqtt_user');
        const pass = localStorage.getItem('mqtt_pass') || '';
        const relayPin = parseInt(localStorage.getItem('relay_pin'), 10) || 1;

        if (!broker || !user) {
            setState('err', '尚未設定', '請先到主頁完成連線設定');
            elSetupLink.style.display = 'inline-block';
        }

        // app 切到背景時若連線還在進行中就主動斷線，避免殘留連線；
        // 但「切回前景」不會自動再開門，一律要使用者自己按按鈕
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible' && !confirmed && activeClient) {
                try { activeClient.disconnect(); } catch (e) { /* already closed */ }
                busy = false;
            }
        });

        elIcon.addEventListener('click', attemptOpen);

        function attemptOpen() {
            if (!broker || !user) return;
            if (busy) return; // 連線/等待回應中，忽略重複點擊
            busy = true;
            openDoor();
        }

        function openDoor() {
            // 每次觸發都重新計時、重新視為未確認，這樣切回前景重新開門時
            // 「總耗時」顯示的才是這一次的時間，不是沿用上一次的舊值
            t0 = performance.now();
            confirmed = false;
            setState('pending', '連線中…', broker);
            elSetupLink.style.display = 'none';
            elMetaTime.textContent = '';
            elMetaIp.textContent = '';

            const topicCmd = `iot/v1/${TENANT_ID}/${user}/cmd`;
            const topicState = `iot/v1/${TENANT_ID}/${user}/state`;
            const topicStatus = `iot/v1/${TENANT_ID}/${user}/status`;
            const clientId = 'Opener_' + Math.random().toString(16).slice(2, 10);
            const client = new Paho.MQTT.Client(broker, 8884, clientId);
            activeClient = client;

            let timeoutId = null;

            client.onConnectionLost = (res) => {
                busy = false;
                if (!confirmed && res.errorCode !== 0) {
                    setState('err', '連線中斷', res.errorMessage || '');
                }
            };

            client.onMessageArrived = (msg) => {
                if (msg.destinationName === topicStatus) {
                    try {
                        const data = JSON.parse(msg.payloadString);
                        if (data.ip) elMetaIp.textContent = `裝置 IP：${data.ip}`;
                    } catch (e) { /* ignore malformed payload */ }
                    return;
                }
                if (msg.destinationName !== topicState) return;
                try {
                    const data = JSON.parse(msg.payloadString);
                    if (data.state === 1) {
                        confirmed = true;
                        busy = false;
                        clearTimeout(timeoutId);
                        const elapsedMs = Math.round(performance.now() - t0);
                        setState('ok', '門已開啟');
                        elMetaTime.textContent = `總耗時：${elapsedMs} ms`;
                    }
                } catch (e) { /* ignore malformed payload */ }
            };

            client.connect({
                userName: user,
                password: pass,
                useSSL: true,
                timeout: 8,
                onSuccess: () => {
                    // 訂閱 state 一定要在送出指令「之前」，否則裝置回應可能在我們
                    // 訂閱好之前就到，導致收不到確認；但 status（IP）只是附加資訊，
                    // 不影響開門本身是否成功，故延後到送出指令之後才訂閱，
                    // 讓開門指令盡早離開裝置，不被非必要的網路往返拖慢。
                    client.subscribe(topicState);

                    const message = new Paho.MQTT.Message(JSON.stringify({ pin: relayPin, val: 1 }));
                    message.destinationName = topicCmd;
                    client.send(message);
                    setState('pending', '已送出開門指令…', '等待裝置回應');

                    client.subscribe(topicStatus);

                    timeoutId = setTimeout(() => {
                        if (!confirmed) {
                            busy = false;
                            const elapsedMs = Math.round(performance.now() - t0);
                            setState('err', '未收到裝置回應', '指令已送出，但無法確認是否成功');
                            elMetaTime.textContent = `已等待：${elapsedMs} ms`;
                        }
                    }, CONFIRM_TIMEOUT_MS);
                },
                onFailure: (err) => {
                    busy = false;
                    setState('err', '連線失敗', (err && err.errorMessage) || '請檢查網路');
                }
            });
        }
    </script>
</body>
</html>
