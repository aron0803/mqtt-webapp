<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>開門</title>

    <link rel="manifest" href="manifest-open.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="開門">
    <link rel="apple-touch-icon" href="icon-open.svg">
    <link rel="icon" href="icon-open.svg" type="image/svg+xml">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

    <style>
        /* iOS 系統色（沿用 iOS 17/18 Dark Mode 的號誌色，畫面本身固定深色，
           不隨系統淺色模式切換——門禁控制頁刻意維持單一風格，不做淺色版本） */
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --blue: #0a84ff;
            --green: #30d158;
            --red: #ff453a;
            --label: #ffffff;
            --label-secondary: rgba(235,235,245,0.6);
            --label-tertiary: rgba(235,235,245,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--label);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overscroll-behavior: none;
        }
        #stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.75rem;
            padding: 2rem;
            text-align: center;
            width: 100%;
            max-width: 340px;
        }

        /* 主按鈕：iOS 風格的實心圓形，狀態靠底色切換（藍/綠/紅），
           模仿 iOS 的「大型圓形操作鍵」語彙（例如接聽/掛斷電話鍵） */
        #icon {
            width: 148px;
            height: 148px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: #fff;
            font-family: inherit;
            cursor: pointer;
            background: var(--blue);
            box-shadow: 0 8px 24px rgba(10,132,255,0.35);
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.12s ease;
        }
        #icon:active { transform: scale(0.96); }
        #icon.ok { background: var(--green); box-shadow: 0 8px 24px rgba(48,209,88,0.35); }
        #icon.err { background: var(--red); box-shadow: 0 8px 24px rgba(255,69,58,0.35); }
        #icon.pending { pointer-events: none; }

        /* SF Symbols 沒有 CDN 可直接引用，用內嵌 SVG 畫出風格相近的線條圖示 */
        #icon svg { width: 56px; height: 56px; }
        #icon .glyph-ok, #icon .glyph-err { display: none; }
        #icon.ok .glyph-idle, #icon.pending .glyph-idle { display: none; }
        #icon.ok .glyph-ok { display: block; }
        #icon.err .glyph-idle { display: none; }
        #icon.err .glyph-err { display: block; }

        /* iOS 風格的活動指示圈（旋轉圓環），取代原本的閃爍動畫 */
        #spinner {
            display: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3.5px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        #icon.pending #spinner { display: block; }
        #icon.pending svg { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #status {
            font-size: 1.0625rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        #detail {
            font-size: 0.875rem;
            color: var(--label-secondary);
            min-height: 1.2em;
        }
        #meta {
            font-size: 0.75rem;
            color: var(--label-tertiary);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        #meta span { white-space: nowrap; }
        #setup-link {
            display: none;
            color: var(--blue);
            font-size: 0.875rem;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="stage">
        <button id="icon" class="idle">
            <div id="spinner"></div>
            <svg class="glyph-idle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3.5 15 2v19l-9-1.5V3.5Z"/>
                <path d="M15 2 20 3v18l-5-1"/>
                <circle cx="12.3" cy="12" r="0.9" fill="currentColor" stroke="none"/>
            </svg>
            <svg class="glyph-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12.5 9.5 18 20 6"/>
            </svg>
            <svg class="glyph-err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 8v5"/>
                <circle cx="12" cy="16.3" r="0.9" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="12" r="9"/>
            </svg>
        </button>
        <div id="status">連線中…</div>
        <div id="detail"></div>
        <div id="meta">
            <span id="meta-time"></span>
            <span id="meta-ip"></span>
        </div>
        <a id="setup-link" href="index.html">尚未設定，點此開啟設定頁</a>
    </div>

    <script>
        // 一鍵開門頁的觸發時機分兩種，行為刻意不同：
        //
        // 1. 真正「進入頁面」（使用者點圖示開啟 app、或瀏覽器實際載入這個
        //    頁面）：<script> 從頭執行一次，此時自動觸發開門，符合
        //    「點開就自動開門」的需求。
        // 2. app 被切到背景、之後再切回前景：手機不會重新整理頁面，
        //    <script> 不會重新執行，因此「不會」自動再開一次——實測不同
        //    手機/瀏覽器對 standalone PWA 恢復時要不要重新派發
        //    visibilitychange、要不要凍結 JS 的行為不一致，賭這個生命
        //    週期事件並不可靠。這種情況下，畫面上的按鈕本來就還在，
        //    使用者自己點一下即可重新送出開門指令，不需要重新整理頁面。
        //
        // 門機本身的失效安全設計（COM+NO 接線、看門狗、開機安全狀態）都在
        // 裝置韌體端，跟這個頁面用自動觸發還是按鈕觸發無關。

        const TENANT_ID = 'default';
        const CONFIRM_TIMEOUT_MS = 6000;

        const elIcon = document.getElementById('icon');
        const elStatus = document.getElementById('status');
        const elDetail = document.getElementById('detail');
        const elMetaTime = document.getElementById('meta-time');
        const elMetaIp = document.getElementById('meta-ip');
        const elSetupLink = document.getElementById('setup-link');

        let activeClient = null;
        let busy = false;
        let confirmed = false;
        let t0 = 0;

        function setState(mode, status, detail) {
            elIcon.className = mode;
            elStatus.textContent = status;
            elDetail.textContent = detail || '';
        }

        function decodeConfigPayload(text) {
            if (!text) return null;
            let token = text.trim();
            const urlMatch = token.match(/[#&]c=([A-Za-z0-9_-]+)/);
            if (urlMatch) token = urlMatch[1];
            if (token.startsWith('{')) {
                try {
                    const cfg = JSON.parse(token);
                    return (cfg.b && cfg.u) ? cfg : null;
                } catch (e) { return null; }
            }
            if (!/^[A-Za-z0-9_-]+$/.test(token)) return null;
            try {
                let base64 = token.replace(/-/g, '+').replace(/_/g, '/');
                base64 += '='.repeat((4 - base64.length % 4) % 4);
                const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                const cfg = JSON.parse(new TextDecoder().decode(bytes));
                return (cfg.b && cfg.u) ? cfg : null;
            } catch (e) { return null; }
        }

        // 支援跟主頁一樣的 QR 設定 hash，方便同一張 QR 兩邊都能用來設定
        if (location.hash.includes('c=')) {
            const cfg = decodeConfigPayload(location.hash);
            history.replaceState(null, '', location.pathname + location.search);
            if (cfg) {
                localStorage.setItem('mqtt_broker', cfg.b);
                localStorage.setItem('mqtt_user', cfg.u);
                localStorage.setItem('mqtt_pass', cfg.p || '');
            }
        }

        const broker = localStorage.getItem('mqtt_broker');
        const user = localStorage.getItem('mqtt_user');
        const pass = localStorage.getItem('mqtt_pass') || '';
        const relayPin = parseInt(localStorage.getItem('relay_pin'), 10) || 1;

        elIcon.addEventListener('click', attemptOpen);

        if (!broker || !user) {
            setState('err', '尚未設定', '請先到主頁完成連線設定');
            elSetupLink.style.display = 'inline-block';
        } else {
            attemptOpen(); // 真正進入頁面時自動觸發一次
        }

        // app 切到背景時若連線還在進行中就主動斷線，避免殘留連線；
        // 「切回前景」本身不會自動再開門，要靠使用者自己點按鈕
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible' && !confirmed && activeClient) {
                try { activeClient.disconnect(); } catch (e) { /* already closed */ }
                busy = false;
            }
        });

        function attemptOpen() {
            if (!broker || !user) return;
            if (busy) return; // 連線/等待回應中，忽略重複觸發
            busy = true;
            openDoor();
        }

        function openDoor() {
            // 每次觸發都重新計時、重新視為未確認，讓「總耗時」顯示的是這一次的時間
            t0 = performance.now();
            confirmed = false;
            setState('pending', '連線中…', broker);
            elSetupLink.style.display = 'none';
            elMetaTime.textContent = '';
            elMetaIp.textContent = '';

            const topicCmd = `iot/v1/${TENANT_ID}/${user}/cmd`;
            const topicState = `iot/v1/${TENANT_ID}/${user}/state`;
            const topicStatus = `iot/v1/${TENANT_ID}/${user}/status`;
            const clientId = 'Opener_' + Math.random().toString(16).slice(2, 10);
            const client = new Paho.MQTT.Client(broker, 8884, clientId);
            activeClient = client;

            let timeoutId = null;

            client.onConnectionLost = (res) => {
                busy = false;
                if (!confirmed && res.errorCode !== 0) {
                    setState('err', '連線中斷', res.errorMessage || '');
                }
            };

            client.onMessageArrived = (msg) => {
                if (msg.destinationName === topicStatus) {
                    try {
                        const data = JSON.parse(msg.payloadString);
                        if (data.ip) elMetaIp.textContent = `裝置 IP：${data.ip}`;
                    } catch (e) { /* ignore malformed payload */ }
                    return;
                }
                if (msg.destinationName !== topicState) return;
                try {
                    const data = JSON.parse(msg.payloadString);
                    if (data.state === 1) {
                        confirmed = true;
                        busy = false;
                        clearTimeout(timeoutId);
                        const elapsedMs = Math.round(performance.now() - t0);
                        setState('ok', '門已開啟');
                        elMetaTime.textContent = `總耗時：${elapsedMs} ms`;
                    }
                } catch (e) { /* ignore malformed payload */ }
            };

            client.connect({
                userName: user,
                password: pass,
                useSSL: true,
                timeout: 8,
                onSuccess: () => {
                    // 訂閱 state 一定要在送出指令「之前」，否則裝置回應可能在我們
                    // 訂閱好之前就到，導致收不到確認；但 status（IP）只是附加資訊，
                    // 不影響開門本身是否成功，故延後到送出指令之後才訂閱，
                    // 讓開門指令盡早離開裝置，不被非必要的網路往返拖慢。
                    client.subscribe(topicState);

                    const message = new Paho.MQTT.Message(JSON.stringify({ pin: relayPin, val: 1 }));
                    message.destinationName = topicCmd;
                    client.send(message);
                    setState('pending', '已送出開門指令…', '等待裝置回應');

                    client.subscribe(topicStatus);

                    timeoutId = setTimeout(() => {
                        if (!confirmed) {
                            busy = false;
                            const elapsedMs = Math.round(performance.now() - t0);
                            setState('err', '未收到裝置回應', '指令已送出，但無法確認是否成功');
                            elMetaTime.textContent = `已等待：${elapsedMs} ms`;
                        }
                    }, CONFIRM_TIMEOUT_MS);
                },
                onFailure: (err) => {
                    busy = false;
                    setState('err', '連線失敗', (err && err.errorMessage) || '請檢查網路');
                }
            });
        }
    </script>
</body>
</html>
