<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MQTT Remote Control</title>

    <!-- PWA：讓「加入主畫面」後以獨立 App 形式開啟 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MQTT 控制">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="icon" href="icon.svg" type="image/svg+xml">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Main Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Paho MQTT Library (WebSocket Client) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
</head>
<body>
    <div class="app-container">
        <!-- Settings Modal (Hidden by default) -->
        <div id="settings-modal" class="modal glass-panel">
            <h2>Cloud Connection</h2>
            <p>Please enter your HiveMQ credentials.</p>
            
            <div class="input-group">
                <label for="broker">Cluster URL</label>
                <input type="text" id="broker" placeholder="xxx.s1.eu.hivemq.cloud">
            </div>
            
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="esp8266_user">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <button id="btn-scan" class="scan-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                    <rect x="7" y="7" width="4" height="4"></rect>
                    <rect x="13" y="13" width="4" height="4"></rect>
                </svg>
                掃描 QR Code
            </button>
            <button id="btn-scan-file" class="scan-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <path d="M21 15l-5-5L5 21"></path>
                </svg>
                從相簿選擇圖片
            </button>
            <input type="file" id="scan-file-input" accept="image/*" class="hidden">
            <p id="scan-hint" class="scan-hint hidden"></p>

            <button id="btn-connect" class="primary-btn">Connect &amp; Save</button>
        </div>

        <!-- QR 掃描畫面：開啟相機即時辨識，成功後自動填入上方欄位 -->
        <div id="scanner-overlay" class="scanner-overlay hidden">
            <div class="scanner-box">
                <video id="scanner-video" playsinline muted></video>
                <div class="scanner-frame"></div>
            </div>
            <p id="scanner-status" class="scanner-status">正在啟動相機…</p>
            <button id="btn-scan-cancel" class="secondary-btn">取消</button>
        </div>

        <!-- Main Dashboard -->
        <main id="dashboard" class="dashboard hidden">
            <header>
                <div class="header-info">
                    <h1>My Home</h1>
                    <p class="subtitle">Smart Device Control</p>
                </div>
                <div class="status-indicator">
                    <span id="mqtt-status-dot" class="dot offline"></span>
                    <span id="mqtt-status-text">Disconnected</span>
                </div>
            </header>

            <section class="device-list">
                <div class="device-card glass-panel" id="device-gpio0">
                    <div class="card-header">
                        <div class="icon-container">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2v10"></path>
                                <path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path>
                            </svg>
                        </div>
                        <div class="device-info">
                            <h3>Main Switch</h3>
                            <span class="device-status" id="label-gpio4">Waiting for sync...</span>
                        </div>
                    </div>

                    <label class="switch">
                        <input type="checkbox" id="toggle-gpio4" disabled>
                        <span class="slider round"></span>
                    </label>
                </div>
            </section>
            
            <button id="btn-settings" class="icon-btn" title="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </main>
    </div>

    <!-- Application Logic -->
    <!-- 版本號用於破快取：修改 app.js 後請一併把 v 加一，否則回訪的手機會續用舊版 -->
    <script src="app.js?v=6"></script>
</body>
</html>
