<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MQTT Remote Control</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Main Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Paho MQTT Library (WebSocket Client) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
</head>
<body>
    <div class="app-container">
        <!-- Settings Modal (Hidden by default) -->
        <div id="settings-modal" class="modal glass-panel">
            <h2>Cloud Connection</h2>
            <p>Please enter your HiveMQ credentials.</p>
            
            <div class="input-group">
                <label for="broker">Cluster URL</label>
                <input type="text" id="broker" placeholder="xxx.s1.eu.hivemq.cloud">
            </div>
            
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="esp8266_user">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <button id="btn-connect" class="primary-btn">Connect & Save</button>
        </div>

        <!-- Main Dashboard -->
        <main id="dashboard" class="dashboard hidden">
            <header>
                <div class="header-info">
                    <h1>My Home</h1>
                    <p class="subtitle">Smart Device Control</p>
                </div>
                <div class="status-indicator">
                    <span id="mqtt-status-dot" class="dot offline"></span>
                    <span id="mqtt-status-text">Disconnected</span>
                </div>
            </header>

            <section class="device-list">
                <div class="device-card glass-panel" id="device-gpio0">
                    <div class="card-header">
                        <div class="icon-container">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2v10"></path>
                                <path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path>
                            </svg>
                        </div>
                        <div class="device-info">
                            <h3>Main Switch</h3>
                            <span class="device-status" id="label-gpio4">Waiting for sync...</span>
                        </div>
                    </div>

                    <label class="switch">
                        <input type="checkbox" id="toggle-gpio4" disabled>
                        <span class="slider round"></span>
                    </label>
                </div>
            </section>
            
            <button id="btn-settings" class="icon-btn" title="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </main>
    </div>

    <!-- Application Logic -->
    <!-- 版本號用於破快取：修改 app.js 後請一併把 v 加一，否則回訪的手機會續用舊版 -->
    <script src="app.js?v=3"></script>
</body>
</html>
